###############################################
# Modify all parameters related to servoing here
###############################################

## Properties of incoming commands
command_in_type: "speed_units" # "unitless"> in the range [-1:1], as if from joystick. "speed_units"> cmds are in m/s and rad/s
scale:
  # Scale parameters are only used if command_in_type=="unitless"
  linear:  0.5  # Max linear velocity [m/s]. (POSE 모드에서도 적용됨; #16에서 실제로 0.5 적용 — 주석만 있고 값이 0.9였음)
  rotational:  3.0 # Max angular velocity [rad/s]. (5.0->3.0)
  # Max joint angular/linear velocity. Only used for joint commands on joint_command_in_topic.
  joint: 5.0

# Optionally override Servo's internal velocity scaling when near singularity or collision (0.0 = use internal velocity scaling)
# override_velocity_scaling_factor = 0.0 # valid range [0.0:1.0]

## Properties of outgoing commands
publish_period: 0.01  # 1/Nominal publish rate [seconds]
max_expected_latency: 0.1  # delay between sending a command and the robot executing it [seconds]

# What type of topic does your robot driver expect?
# Currently supported are std_msgs/Float64MultiArray or trajectory_msgs/JointTrajectory
command_out_type: trajectory_msgs/JointTrajectory

# What to publish? Can save some bandwidth as most robots only require positions or velocities
publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false

## Plugins for smoothing outgoing commands
use_smoothing: false  # Disabled because acceleration limits not set in URDF
# smoothing_filter_plugin_name: "online_signal_smoothing::AccelerationLimitedPlugin"  # Requires acceleration limits in URDF

# If is_primary_planning_scene_monitor is set to true, the Servo server's PlanningScene advertises the /get_planning_scene service,
# which other nodes can use as a source for information about the planning environment.
# NOTE: If a different node in your system is responsible for the "primary" planning scene instance (e.g. the MoveGroup node),
# then is_primary_planning_scene_monitor needs to be set to false.
is_primary_planning_scene_monitor: true

## MoveIt properties
move_group_name:  left_arm  # Often 'manipulator' or 'arm'
planning_frame: openarm_left_link0  # The MoveIt planning frame. Often 'base_link' or 'world'

## Other frames
ee_frame_name: openarm_left_hand_tcp  # The name of the end effector link, used to return the EE pose
robot_link_command_frame:  openarm_left_hand_tcp  # commands must be given in the frame of a robot link. Usually either the base or end effector

## Stopping behaviour
incoming_command_timeout:  0.1  # Stop servoing if X seconds elapse without a new command
# If 0, republish commands forever even if the robot is stationary. Otherwise, specify num. to publish.
# Important because ROS may drop some messages and we need the robot to halt reliably.
num_outgoing_halt_msgs_to_publish: 4

## Configure handling of singularities and joint limits
## 특이점 감속/정지 사실상 비활성 (원복): 접근-감속의 Zeno 동결과 해제 시 캐치업 점프가
## "멈췄다 휙"의 주성분이라 끔. 특이점 강건성은 DLS 감쇠(use_dls_ik)가 담당하고,
## 캐치업 폭주는 #16 레이트 리밋이 막는다. (검증 베이스라인 20/200은 히스토리 참조)
lower_singularity_threshold:  50000.0
hard_stop_singularity_threshold: 100000.0
joint_limit_margins: [0.07] # 조인트 한계 버퍼 [rad] ≈4° (0.01에서 키워 한계 전 미리 감속)
halt_all_joints_in_cartesian_mode: false  # 한 조인트 한계 시 전체정지(true) 대신 해당 조인트만 정지(false, 덜 잠김)
leaving_singularity_threshold_multiplier: 2.0 # Multiply the hard stop limit by this when leaving singularity (see https://github.com/moveit/moveit2/pull/620)

## #15 DLS(damped least squares) IK + nullspace — 특이점 강건성
## use_dls_ik: true 면 POSE가 TRAC-IK 대신 DLS 자코비안 경로를 탐 (특이점 부드럽게 통과).
## 첫 테스트는 DLS 단독(nullspace_gain 0)으로. 문제 시 use_dls_ik: false로 즉시 복귀.
use_dls_ik: true
dls_max_damping: 0.05          # 특이점 근처 최대 감쇠 λ (크면 부드럽지만 오차↑)
dls_singularity_threshold: 0.05 # 이 특이값 아래로 가면 감쇠 램프인
nullspace_gain: 0.0          # OFF (감사 결과: 체감이득 없음 + 떨림 용의자. redundancy 실험 종료)

## Topic names
cartesian_command_in_topic: ~/delta_twist_cmds  # Topic for incoming Cartesian twist commands
joint_command_in_topic: ~/delta_joint_cmds # Topic for incoming joint angle commands
joint_topic: /joint_states
status_topic: ~/status # Publish status to this topic
command_out_topic: /left_joint_trajectory_controller/joint_trajectory # Publish outgoing commands here

## Collision checking for the entire robot body
check_collisions: false # Check collisions? (disabled for smoother simulation)
collision_check_rate: 10.0 # [Hz] Collision-checking can easily bog down a CPU if done too often.
self_collision_proximity_threshold: 0.005 # Start decelerating when a self-collision is this far [m]
scene_collision_proximity_threshold: 0.01 # Start decelerating when a scene collision is this far [m]

# Use the left servo planning scene as the monitored planning scene source.
monitored_planning_scene_topic: /quest_teleop_bimanual/publish_planning_scene
