# OpenArm 추론 설정

policy:
  # HuggingFace Hub repo_id 또는 로컬 경로 둘 다 가능
  # path: "/home/sst/openarm/src/openarm_lerobot/checkpoints/my_policy"  # 로컬
  path: "xhaka3456/flowmatching_openarm_pick_strawberry_and_place_on_white_plate2"
  device: "cuda"  # "cuda" or "cpu"

inference:
  fps: 30
  single_task: "Pick the strawberry models and place them on a white plate."
  execute_steps: 50  # null이면 학습된 chunk_size 전부 실행. 숫자 지정 시 앞 N개만 실행 (예: 50)
  # depth_cameras: ["left_wrist", "right_wrist"]  # RGB → Depth Anything V2 실시간 추론할 카메라

# ROS 2 토픽
topics:
  joint_states: "/joint_states"
  left_eef_pose: "/left_eef_pose"
  right_eef_pose: "/right_eef_pose"
  left_eef_delta: "/left_eef_delta"
  right_eef_delta: "/right_eef_delta"
  left_target_joint_positions: "/left_target_joint_positions"
  right_target_joint_positions: "/right_target_joint_positions"
  left_gripper: "/left_gripper_trigger"
  right_gripper: "/right_gripper_trigger"
  quest_x_button: "/quest_x_button"
  quest_rerecord: "/quest_rerecord"

# 카메라 설정 — 수집 시와 동일하게 맞춤
cameras:
  # head RGB + depth: camera_tcp_streamer 토픽 구독 (수집과 동일한 colormap 보장)
  head:
    type: "ros2_topic"
    topic: "/camera/head/color/raw"
    width: 640
    height: 480
    use_depth: true
    depth_topic: "/camera/head/depth/colormap"
    # depth 범위는 런치 파일(camera_tcp_streamer)에서 설정
  right_wrist:
    type: "opencv"
    index: 2
    width: 640
    height: 480
    fps: 30
  left_wrist:
    type: "opencv"
    index: 4
    width: 640
    height: 480
    fps: 30
